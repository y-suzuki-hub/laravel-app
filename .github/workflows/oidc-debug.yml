name: oidc-debug

# 一時的な調査用: GitHub が発行する OIDC トークンの中身（subject など）を表示する。AWS には接続しない。
on:
  push:
    branches:
      - 'claude/**'

permissions:
  contents: read
  id-token: write

jobs:
  show:
    runs-on: ubuntu-latest
    steps:
      - name: Show OIDC claims
        run: |
          TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          python3 - "$TOKEN" <<'PY'
          import base64, json, sys
          payload = sys.argv[1].split('.')[1]
          payload += '=' * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          print(json.dumps({key: claims.get(key) for key in ('iss', 'sub', 'aud', 'repository', 'repository_id', 'repository_owner_id', 'ref', 'environment')}, indent=2))
          PY
